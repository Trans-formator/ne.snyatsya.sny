<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фокус-кот</title>
<style>
  :root { --bg:#fdf6ec; --card:#fff; --ink:#3b2f2f; --accent:#e8743b; --soft:#f3e3d0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1e1a1a; --card:#2a2424; --ink:#f3e9e0; --accent:#f08a54; --soft:#3a3030; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font-family:system-ui,"Segoe UI",sans-serif; padding:16px; }
  .card { background:var(--card); border-radius:24px; padding:28px; width:min(380px,100%); text-align:center;
          box-shadow:0 10px 40px rgba(0,0,0,.12); }
  h1 { margin:0 0 4px; font-size:22px; }
  .mode { color:var(--accent); font-weight:600; margin-bottom:8px; }
  #cat { width:200px; height:150px; }
  .time { font-size:64px; font-variant-numeric:tabular-nums; font-weight:700; margin:6px 0; }
  .msg { min-height:24px; margin-bottom:14px; }
  button { font:inherit; border:0; border-radius:12px; padding:10px 18px; margin:0 4px; cursor:pointer;
           background:var(--soft); color:var(--ink); }
  button.main { background:var(--accent); color:#fff; font-weight:600; }
  .stats { display:flex; gap:8px; margin-top:20px; }
  .stat { flex:1; background:var(--soft); border-radius:12px; padding:10px 4px; }
  .stat b { display:block; font-size:22px; }
  .stat span { font-size:12px; opacity:.75; }
  .zzz { font-size:22px; fill:var(--accent); font-weight:700; }
  .zzz text { animation:float 2.4s infinite ease-in-out; opacity:0; }
  .zzz text:nth-child(2) { animation-delay:.8s; } .zzz text:nth-child(3) { animation-delay:1.6s; }
  @keyframes float { 0%{opacity:0;transform:translate(0,8px)} 40%{opacity:1} 100%{opacity:0;transform:translate(10px,-14px)} }
  .shake { animation:shake .5s 2; }
  @keyframes shake { 25%{transform:rotate(-4deg)} 75%{transform:rotate(4deg)} }
  .hide { display:none; }
</style>
</head>
<body>
<div class="card">
  <h1>😺 Фокус-кот</h1>
  <div class="mode" id="mode">Фокус · 25 мин</div>

  <svg id="cat" viewBox="0 0 200 150" role="img" aria-label="Кот">
    <ellipse cx="100" cy="112" rx="70" ry="30" fill="#f2a65a"/>
    <path d="M165 118 q30 -5 20 -30" stroke="#f2a65a" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="82" r="38" fill="#f2a65a"/>
    <path d="M68 58 L72 28 L92 48Z M132 58 L128 28 L108 48Z" fill="#f2a65a"/>
    <path d="M73 40 L74 34 L84 44Z M127 40 L126 34 L116 44Z" fill="#f7c9a0"/>
    <g id="eyesSleep"><path d="M78 80 q8 8 16 0 M106 80 q8 8 16 0" stroke="#3b2f2f" stroke-width="3" fill="none" stroke-linecap="round"/></g>
    <g id="eyesAwake" class="hide">
      <circle cx="86" cy="80" r="8" fill="#fff"/><circle cx="114" cy="80" r="8" fill="#fff"/>
      <circle id="pupL" cx="86" cy="80" r="4" fill="#3b2f2f"/><circle id="pupR" cx="114" cy="80" r="4" fill="#3b2f2f"/>
      <path id="brows" d="M76 68 L94 74 M124 68 L106 74" stroke="#3b2f2f" stroke-width="3" stroke-linecap="round" class="hide"/>
    </g>
    <path d="M96 92 l4 4 l4 -4Z" fill="#d9777a"/>
    <path d="M100 96 v4 M100 100 q-6 6 -12 2 M100 100 q6 6 12 2" stroke="#3b2f2f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M60 90 h-22 M60 96 l-20 6 M140 90 h22 M140 96 l20 6" stroke="#3b2f2f" stroke-width="1.5" opacity=".5"/>
    <g class="zzz" id="zzz"><text x="135" y="45">Z</text><text x="150" y="35">z</text><text x="162" y="27">z</text></g>
  </svg>

  <div class="time" id="time">25:00</div>
  <div class="msg" id="msg" aria-live="polite">Нажми «Старт» — кот пойдёт спать.</div>

  <button class="main" id="start">Старт</button>
  <button id="reset">Сброс</button>
  <button id="skip">Пропустить</button>

  <div class="stats">
    <div class="stat"><b id="sSess">0</b><span>сессий сегодня</span></div>
    <div class="stat"><b id="sMin">0</b><span>минут фокуса</span></div>
    <div class="stat"><b id="sDist">0</b><span>отвлечений</span></div>
  </div>
</div>

<script>
const FOCUS = 25*60, BREAK = 5*60;
const $ = id => document.getElementById(id);
const cat = $('cat');
let mode = 'focus', left = FOCUS, timer = null, endAt = 0;

const today = new Date().toISOString().slice(0,10);
let stats = {sess:0, min:0, dist:0};
try {
  const s = JSON.parse(localStorage.getItem('focuscat')||'null');
  if (s && s.day === today) stats = s.stats;
} catch(e) {}
const save = () => { try { localStorage.setItem('focuscat', JSON.stringify({day:today, stats})); } catch(e) {} };

function render() {
  const m = String(Math.floor(left/60)).padStart(2,'0'), s = String(left%60).padStart(2,'0');
  $('time').textContent = `${m}:${s}`;
  $('mode').textContent = mode==='focus' ? 'Фокус · 25 мин' : 'Перерыв · 5 мин';
  $('start').textContent = timer ? 'Пауза' : 'Старт';
  document.title = timer ? `${m}:${s} · Фокус-кот` : 'Фокус-кот';
  $('sSess').textContent = stats.sess; $('sMin').textContent = stats.min; $('sDist').textContent = stats.dist;
}
function setCat(state) { // sleep | awake | angry
  $('eyesSleep').classList.toggle('hide', state!=='sleep');
  $('eyesAwake').classList.toggle('hide', state==='sleep');
  $('brows').classList.toggle('hide', state!=='angry');
  $('zzz').classList.toggle('hide', state!=='sleep');
}
function say(t) { $('msg').textContent = t; }

function tick() {
  left = Math.max(0, Math.round((endAt - Date.now())/1000));
  if (left === 0) return finish();
  render();
}
function begin() {
  endAt = Date.now() + left*1000;
  timer = setInterval(tick, 250);
  if (mode==='focus') { setCat('sleep'); say('Тсс… кот спит. Не буди его.'); }
  else { setCat('awake'); say('Перерыв! Потянись, попей воды.'); }
  render();
}
function pause() { clearInterval(timer); timer = null; setCat('awake'); say('Пауза. Кот потягивается.'); render(); }
function finish() {
  clearInterval(timer); timer = null;
  if (mode==='focus') { stats.sess++; stats.min += FOCUS/60; save(); }
  mode = mode==='focus' ? 'break' : 'focus';
  left = mode==='focus' ? FOCUS : BREAK;
  setCat('awake'); cat.classList.add('shake');
  setTimeout(()=>cat.classList.remove('shake'), 1100);
  say(mode==='break' ? 'Готово! Кот проснулся и гордится тобой 🐾' : 'Перерыв окончен. Пора снова за дело!');
  try { new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play(); } catch(e) {}
  render();
}

$('start').onclick = () => timer ? pause() : begin();
$('reset').onclick = () => { clearInterval(timer); timer = null; left = mode==='focus' ? FOCUS : BREAK; setCat('awake'); say('Сброшено.'); render(); };
$('skip').onclick = () => { clearInterval(timer); timer = null; mode = mode==='focus' ? 'break' : 'focus'; left = mode==='focus' ? FOCUS : BREAK; setCat('awake'); say('Режим переключён.'); render(); };

// Кот следит за тобой: ушёл с вкладки во время фокуса — он просыпается
document.addEventListener('visibilitychange', () => {
  if (!timer || mode!=='focus') return;
  if (document.hidden) {
    stats.dist++; save();
    setCat('angry'); cat.classList.add('shake');
  } else {
    setTimeout(()=>cat.classList.remove('shake'), 1000);
    say('Ты сбежал на другую вкладку! Кот недоволен 😾');
    render();
    setTimeout(() => { if (timer) { setCat('sleep'); say('Ладно… кот снова засыпает.'); } }, 3000);
  }
});

// Зрачки следят за мышкой
document.addEventListener('mousemove', e => {
  const r = cat.getBoundingClientRect();
  const dx = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width/2)) / 300));
  const dy = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height/2)) / 300));
  [['pupL',86],['pupR',114]].forEach(([id,x]) => { $(id).setAttribute('cx', x + dx*3); $(id).setAttribute('cy', 80 + dy*3); });
});

setCat('awake'); render();
</script>
</body>
</html>
